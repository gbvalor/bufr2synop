name: CI

on:
  push:
    branches: [master, testing]
  pull_request:
    branches: [master, testing]

jobs:
  autotools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool build-essential

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool
          # Homebrew only exposes libtool's GNU tools as glibtool(ize); autotools expects
          # unprefixed names, so put the gnubin shim dir on PATH for later steps.
          echo "$(brew --prefix libtool)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Bootstrap autotools files
        run: make -f Makefile.cvs

      - name: Configure
        run: |
          mkdir build0
          cd build0
          ../configure

      - name: Build
        run: make -C build0 -j"$(sysctl -n hw.ncpu 2>/dev/null || nproc)"

      - name: Run regression suite
        run: tests/regression/run.sh

  cmake:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Configure
        run: |
          mkdir build
          cd build
          cmake ..

      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu 2>/dev/null || nproc)"

      - name: Run regression suite
        run: tests/regression/run.sh
